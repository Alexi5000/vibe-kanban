name: 'Setup Jsign'
description: 'Downloads and caches Jsign for cross-platform Windows code signing'

inputs:
  version:
    description: 'Jsign version'
    required: false
    default: '7.4'
  sha256:
    description: 'Expected SHA256 of the jar'
    required: false
    default: '2abf2ade9ea322acc2d60c24794eadc465ff9380938fca4c932d09e0b25f1c28'

outputs:
  jar-path:
    description: 'Path to the Jsign jar'
    value: ${{ steps.path.outputs.jar }}

runs:
  using: 'composite'
  steps:
    - name: Set jar path
      id: path
      shell: bash
      env:
        JSIGN_VERSION: ${{ inputs.version }}
        JSIGN_SHA256: ${{ inputs.sha256 }}
      run: |
        if [[ ! "$JSIGN_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then
          echo 'Invalid Jsign version' >&2
          exit 1
        fi
        if [[ ! "$JSIGN_SHA256" =~ ^[[:xdigit:]]{64}$ ]]; then
          echo 'Invalid Jsign SHA256' >&2
          exit 1
        fi
        if [[ "$RUNNER_TEMP" == *$'\n'* || "$RUNNER_TEMP" == *$'\r'* ]]; then
          echo 'Invalid runner temporary directory' >&2
          exit 1
        fi
        printf 'jar=%s/jsign-%s.jar\n' "$RUNNER_TEMP" "$JSIGN_VERSION" >> "$GITHUB_OUTPUT"

    - name: Cache Jsign
      id: cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: ${{ steps.path.outputs.jar }}
        key: jsign-${{ inputs.version }}-${{ inputs.sha256 }}

    - name: Download Jsign
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        JSIGN_VERSION: ${{ inputs.version }}
        JSIGN_JAR: ${{ steps.path.outputs.jar }}
      run: |
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          "https://github.com/ebourg/jsign/releases/download/$JSIGN_VERSION/jsign-$JSIGN_VERSION.jar" \
          -o "$JSIGN_JAR"

    - name: Verify checksum
      shell: bash
      env:
        JSIGN_SHA256: ${{ inputs.sha256 }}
        JSIGN_JAR: ${{ steps.path.outputs.jar }}
      run: |
        actual=$(sha256sum < "$JSIGN_JAR")
        actual=${actual%% *}
        expected=$(printf '%s' "$JSIGN_SHA256" | tr 'A-F' 'a-f')
        if [[ "$actual" != "$expected" ]]; then
          echo 'Jsign checksum mismatch' >&2
          exit 1
        fi
