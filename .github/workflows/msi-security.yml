name: MSI command security
on:
  pull_request:
    paths:
      - 'scripts/build-tauri-msi.js'
      - 'scripts/test-msi-shell-boundary.cjs'
      - '.github/workflows/msi-security.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/build-tauri-msi.js'
      - 'scripts/test-msi-shell-boundary.cjs'
      - '.github/workflows/msi-security.yml'
permissions:
  contents: read
jobs:
  command-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - run: node --test scripts/test-msi-shell-boundary.cjs
